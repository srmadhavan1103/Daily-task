<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 80%;
            background-color: #1f1f1f;
            color: white;
            max-width: 600px;
            padding: 20px;
            margin: 20px auto;
        }
        .paragraph{
           font-size: 1.5rem;
        }
        .responsive-heading {
            font-size: 5vw;
        }
        .font1 {
            font-family: Arial, sans-serif;
            font-size: 32px;
        }

        .font2 {
            font-family: Georgia, serif;
            font-size: 28px;
        }

        .font3 {
            font-family: "Courier New", monospace;
            font-size: 20px;
        }

        .font4 {
            font-family: Verdana, sans-serif;
            font-size: 18px;
        }
        .responsive-box{
            background-color: lightblue;
            padding: 20px;
        }
        @media  (max-width:768px){
            .responsive-box{
                background-color: #1f1f1f;
                color: white;
            }
        }
        body {
            background-color: lightblue;
        }
        @media (max-width: 1024px) {

            body {
                background-color: lightgreen;
            }

        }
        @media (max-width: 767px) {

            body {
                background-color: lightcoral;
            }
        }
        .grid-layout{
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 20px;
        }
        .item{
            background-color: lightblue;
            padding: 30px;
            text-align: center;
            border: 2px solid steelblue;
        }
        @media(max-width:1024px){
            .grid-layout{
                grid-template-columns:repeat(1,1fr) ;
            }
        }
        @media(max-width:768px){
            .grid-layout{
                grid-template-columns:1fr ;
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        Hi I'm Madhavan
    </div>
    <p class="paragraph">This is paragraph</p>
    <h1 class="responsive-heading">
        Welcome to My Website
    </h1>

    <h1 class="font1">Arial font</h1>
    <h2 class="font2">Georgia Font</h2>
    <p class="font3">Courier New Font</p>
    <p class="font4">Verdana Font</p>

    <div class="responsive-box">
        Write a media query that changes background color below 768px.
    </div>


    <div class="grid-layout">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>
</body>
</html>
