<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            width: 300px;
            padding: 20px;
            border: 10px solid green;
        }
        .a{
            width: 200px;
            border: 2px solid red;
            padding: 25px;
            margin-left: 25px;

        }
        .container{
            width: 600px;
            padding: 20px;
            border: 2px solid black;
            margin: 0 auto;
        }
        .btn{
            width: 600px;
            display: flex;
            gap: 10px;
            padding: 10px;        }
        button{
            padding: 20px;
            flex: 1;
        }
        .b{
            padding: 40px 10px 20px 50px;
            border: 2px solid yellow;
        }
    </style>
</head>
<body>
    <div class="box">Box Model</div>
    <div class="a">Width</div>
    <div class="container">Center box</div>
    <div class="btn">
        <button>Button 1</button>
        <button>Button 2</button>
        <button>Button 3</button>
    </div>
    <div class="b">different padding</div>
</body>
</html>
