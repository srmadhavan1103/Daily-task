<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=10;
        var b=20;
        const c=30;
        console.log('let='+a);
        console.log('var='+b);
        console.log('const='+c);

        let name="Madhavan";
        let age=22;
        let Student=true;
        let salary=null;
        let address;
        console.log(name);
        console.log(age);
        console.log(Student);
        console.log(salary);
        console.log(address);

        let l=20;
        let s=10;
        console.log(l+s);
        console.log(l-s);
        console.log(l*s);
        console.log(l/s);
        console.log(l%s);
        console.log(l==s);
        console.log(l===s);
        console.log(l&&s);
        console.log(l||s);
    </script>
